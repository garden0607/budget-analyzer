<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">          <!-- th: 문법 사용 선언 -->

<!-- 공통 head 도장: 탭 제목 "로그인 - 소비 분석 가계부", CSS·api.js 불러오기 -->
<head th:replace="~{fragments/layout :: head('로그인')}"></head>

<body>
<!-- 로그인 전 화면이라 header 도장은 찍지 않음 -->
<main class="container" style="max-width: 400px;">              <!-- 가운데 정렬, 폭을 400px로 좁게 -->
    <div class="card">                                          <!-- 흰 상자 -->
        <h2>로그인</h2>

        <!-- form: 입력칸 묶음. novalidate = 브라우저 기본 검사 대신 우리 JS·서버 검사 사용 -->
        <form id="login-form" novalidate>
            <div class="form-group">                            <!-- 입력칸 한 묶음 (라벨 + 입력) -->
                <label for="email">이메일</label>               <!-- for: 누르면 id="email" 칸으로 커서 이동 -->
                <input type="email" id="email" name="email"
                       placeholder="example@email.com" required> <!-- 이메일 입력칸 -->
            </div>

            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password"
                       placeholder="비밀번호" required>          <!-- type=password: 입력값이 ●●●로 가려짐 -->
            </div>

            <p id="error-msg" class="error-msg"></p>             <!-- 실패 시 JS가 에러 문구를 넣는 자리 -->

            <button type="submit" class="btn btn-primary"
                    style="width: 100%;">로그인</button>         <!-- 누르면 form 제출 → JS가 가로챔 -->
        </form>

        <p style="margin-top: 16px; text-align: center;">
            계정이 없으신가요? <a th:href="@{/signup}" style="color: var(--primary);">회원가입</a> <!-- 회원가입 화면으로 -->
        </p>
    </div>
</main>

<script th:src="@{/js/login.js}" defer></script>                 <!-- 로그인 동작 JS (2단계에서 만듦) -->
</body>
</html>
