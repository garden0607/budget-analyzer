<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">          <!-- th: 문법 사용 선언 -->

<!-- 공통 head 도장: 탭 제목 "회원가입 - 소비 분석 가계부" -->
<head th:replace="~{fragments/layout :: head('회원가입')}"></head>

<body>
<!-- 로그인 전 화면이라 header 도장은 찍지 않음 -->
<main class="container" style="max-width: 400px;">              <!-- 로그인 화면과 같은 폭 -->
    <div class="card">
        <h2>회원가입</h2>

        <form id="signup-form" novalidate>                       <!-- 입력칸 묶음. 검사는 서버 규칙으로 통일 -->
            <div class="form-group">
                <label for="email">이메일</label>
                <input type="email" id="email" name="email"
                       placeholder="example@email.com" maxlength="100"> <!-- DTO: @Email, 100자 이하 -->
            </div>

            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password"
                       placeholder="비밀번호" maxlength="20">     <!-- DTO: 영문+숫자 8~20자 -->
                <small style="color: var(--muted);">영문과 숫자를 포함해 8~20자</small> <!-- 규칙 미리 안내 -->
            </div>

            <div class="form-group">
                <label for="passwordConfirm">비밀번호 확인</label>
                <input type="password" id="passwordConfirm" name="passwordConfirm"
                       placeholder="비밀번호를 한 번 더 입력" maxlength="20"> <!-- DTO: passwordConfirm -->
            </div>

            <div class="form-group">
                <label for="nickname">닉네임</label>
                <input type="text" id="nickname" name="nickname"
                       placeholder="2~10자" maxlength="10">       <!-- DTO: 2~10자 -->
            </div>

            <p id="error-msg" class="error-msg"></p>             <!-- 실패 시 JS가 에러 문구를 넣는 자리 -->

            <button type="submit" class="btn btn-primary"
                    style="width: 100%;">가입하기</button>         <!-- 누르면 form 제출 → JS가 가로챔 -->
        </form>

        <p style="margin-top: 16px; text-align: center;">
            이미 계정이 있으신가요? <a th:href="@{/login}" style="color: var(--primary);">로그인</a> <!-- 로그인 화면으로 -->
        </p>
    </div>
</main>

<script th:src="@{/js/signup.js}" defer></script>                <!-- 회원가입 동작 JS (4단계에서 만듦) -->
</body>
</html>
