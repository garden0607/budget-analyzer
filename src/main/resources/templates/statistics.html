<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">               <!-- th: 문법 사용 선언 -->

<!-- 공통 head 도장: 탭 제목 "통계 - 소비 분석 가계부" -->
<head th:replace="~{fragments/layout :: head('통계')}"></head>

<body>
<!-- 공통 헤더 도장 -->
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">

    <!-- ① 제목 + 월 이동 -->
    <div class="card">
        <div class="page-header" style="margin-bottom: 0;">
            <h2>통계</h2>
            <div class="month-nav">                                  <!-- 예산 화면에서 만든 월 이동 CSS 재사용 -->
                <button type="button" id="prev-month" class="btn btn-sm btn-outline">◀</button>
                <strong id="month-label"></strong>                   <!-- "2026년 11월" -->
                <button type="button" id="next-month" class="btn btn-sm btn-outline">▶</button>
            </div>
        </div>
        <p id="error-msg" class="error-msg"></p>                     <!-- 실패 문구 자리 -->
    </div>

    <!-- ② 월 요약 카드 3개 (FR-13) -->
    <div class="stat-cards">
        <div class="card stat-card">
            <span class="muted">수입</span>
            <strong id="sum-income" class="amount-income">0원</strong>
        </div>
        <div class="card stat-card">
            <span class="muted">지출</span>
            <strong id="sum-expense" class="amount-expense">0원</strong>
        </div>
        <div class="card stat-card">
            <span class="muted">잔액</span>
            <strong id="sum-balance">0원</strong>                    <!-- 양수 파랑, 음수 빨강 (JS) -->
        </div>
    </div>

    <!-- ③ 차트 두 개를 나란히 -->
    <div class="grid-2">
        <div class="card">                                           <!-- 카테고리별 지출 비율 (FR-14) -->
            <h3>카테고리별 지출 비율</h3>
            <p id="ratio-total" class="muted"></p>                    <!-- "총 지출 18,000원" -->
            <div class="chart-box"><canvas id="ratio-chart"></canvas></div> <!-- 원형 차트를 그릴 도화지 -->
            <p id="ratio-empty" class="empty-note" hidden>이번 달 지출 내역이 없습니다.</p> <!-- 지출 0원이면 차트 대신 -->
        </div>

        <div class="card">                                           <!-- 전월 대비 (FR-15) -->
            <h3>전월 대비 지출</h3>
            <div class="chart-box"><canvas id="compare-chart"></canvas></div> <!-- 막대 차트를 그릴 도화지 -->
            <table class="table" style="margin-top: 12px;">
                <thead>
                <tr>
                    <th>카테고리</th>
                    <th class="text-right" id="col-last">지난달</th> <!-- JS가 "10월"로 바꿈 -->
                    <th class="text-right" id="col-this">이번 달</th> <!-- JS가 "11월"로 바꿈 -->
                    <th class="text-right">증감</th>
                    <th class="text-right">증감률</th>
                </tr>
                </thead>
                <tbody id="compare-list"></tbody>                     <!-- JS가 카테고리별 줄을 채움 -->
            </table>
        </div>
    </div>
</main>

<script th:src="@{/js/lib/chart.umd.min.js}" defer></script>          <!-- Chart.js (우리 서버에 넣어 둔 파일) → 먼저 불러옴 -->
<script th:src="@{/js/statistics.js}" defer></script>                 <!-- 통계 화면 동작 JS (4단계) → Chart.js 다음에 실행 -->
</body>
</html>
